<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #B7B2BF; text-decoration:none; }
    a:hover { color: #F3F1ED; }
    ::-webkit-scrollbar { display: none; }
    input::placeholder { color: #6E6A78; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#0E0D10; font-family:'Manrope',sans-serif; color:#F3F1ED; position:relative; overflow:hidden; display:flex; flex-direction:column;">

  <div style="flex:0 0 auto; padding:20px 24px 0; display:flex; align-items:center; justify-content:space-between;">
    <div style="width:38px; height:38px; border-radius:50%; background:#17161A; border:1px solid #201E24; display:flex; align-items:center; justify-content:center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F3F1ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </div>
    <span style="font-size:11.5px; font-weight:700; color:#8B8794; letter-spacing:0.02em;">Step 2 of 6</span>
  </div>

  <div style="flex:0 0 auto; padding:16px 24px 0; display:flex; gap:5px;">
    <div style="flex:1; height:4px; border-radius:3px; background:{{accentHex}};"></div>
    <div style="flex:1; height:4px; border-radius:3px; background:{{accentHex}};"></div>
    <div style="flex:1; height:4px; border-radius:3px; background:#232028;"></div>
    <div style="flex:1; height:4px; border-radius:3px; background:#232028;"></div>
    <div style="flex:1; height:4px; border-radius:3px; background:#232028;"></div>
    <div style="flex:1; height:4px; border-radius:3px; background:#232028;"></div>
  </div>

  <sc-if value="{{isEnterStage}}" hint-placeholder-val="true">
    <div style="flex:1; padding:32px 28px 40px; display:flex; flex-direction:column;">
      <div style="font-family:'Bodoni Moda',serif; font-size:26px; font-weight:600; color:#FFFFFF;">What&rsquo;s your email?</div>
      <p style="font-size:13.5px; color:#8B8794; margin:8px 0 28px;">We&rsquo;ll send a one-time code &mdash; no password needed.</p>

      <label style="font-size:12px; font-weight:600; color:#B7B2BF; margin-bottom:8px;">Email address</label>
      <div style="display:flex; align-items:center; gap:9px; padding:14px 16px; border-radius:12px; background:#17161A; border:1px solid rgba({{accentRgb}},0.5); margin-top:6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
        <input type="email" placeholder="you@example.com" value="arjun.kumar@gmail.com" style="flex:1; border:none; outline:none; background:transparent; font-family:'Manrope',sans-serif; font-size:14px; color:#F3F1ED;">
      </div>

      <div style="flex:1;"></div>

      <div style="display:flex; align-items:center; justify-content:center; padding:15px; border-radius:12px; background:{{accentHex}};">
        <span style="font-size:14px; font-weight:700; color:#0E0D10;">Send code</span>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isVerifyStage}}" hint-placeholder-val="false">
    <div style="flex:1; padding:32px 28px 40px; display:flex; flex-direction:column;">
      <div style="font-family:'Bodoni Moda',serif; font-size:26px; font-weight:600; color:#FFFFFF;">Check your email</div>
      <p style="font-size:13.5px; color:#8B8794; margin:8px 0 28px;">We sent a 6-digit code to <span style="color:#C9C5D1; font-weight:600;">arjun.kumar@gmail.com</span></p>

      <div style="display:flex; gap:9px; justify-content:center;">
        <div style="width:44px; height:52px; border-radius:11px; background:#17161A; border:1.5px solid {{accentHex}}; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:#F3F1ED;">4</div>
        <div style="width:44px; height:52px; border-radius:11px; background:#17161A; border:1.5px solid {{accentHex}}; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:#F3F1ED;">2</div>
        <div style="width:44px; height:52px; border-radius:11px; background:#17161A; border:1.5px solid {{accentHex}}; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:#F3F1ED;">8</div>
        <div style="width:44px; height:52px; border-radius:11px; background:#17161A; border:1.5px solid #2A2730; display:flex; align-items:center; justify-content:center;">
          <div style="width:2px; height:20px; background:{{accentHex}};"></div>
        </div>
        <div style="width:44px; height:52px; border-radius:11px; background:#17161A; border:1.5px solid #2A2730;"></div>
        <div style="width:44px; height:52px; border-radius:11px; background:#17161A; border:1.5px solid #2A2730;"></div>
      </div>

      <div style="text-align:center; margin-top:22px; font-size:13px; color:#8B8794;">
        Didn&rsquo;t get it? <a href="#" style="font-weight:700; color:{{accentHex}};">Resend code</a>
      </div>

      <div style="flex:1;"></div>

      <div style="display:flex; align-items:center; justify-content:center; padding:15px; border-radius:12px; background:{{accentHex}};">
        <span style="font-size:14px; font-weight:700; color:#0E0D10;">Verify &amp; continue</span>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>

<script data-dc-script data-props='{
  "accent":{"editor":"enum","default":"emerald","options":["emerald","cyan","purple","pink","amber","red"],"section":"Theme"},
  "stage":{"editor":"enum","default":"enter","options":["enter","verify"],"section":"Flow stage"}
}'>
class Component extends DCLogic {
  renderVals() {
    const themes = {
      emerald: { hex: '#00C896', rgb: '0,200,150' },
      cyan:    { hex: '#00E5FF', rgb: '0,229,255' },
      purple:  { hex: '#A855F7', rgb: '168,85,247' },
      pink:    { hex: '#FF7AC2', rgb: '255,122,194' },
      amber:   { hex: '#FFB020', rgb: '255,176,32' },
      red:     { hex: '#FF385C', rgb: '255,56,92' }
    };
    const t = themes[this.props.accent] || themes.emerald;
    const stage = this.props.stage || 'enter';
    return {
      accentHex: t.hex,
      accentRgb: t.rgb,
      isEnterStage: stage === 'enter',
      isVerifyStage: stage === 'verify'
    };
  }
}
</script>
</body>
</html>
