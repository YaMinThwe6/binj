<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #B7B2BF; text-decoration:none; }
    a:hover { color: #F3F1ED; }
    ::-webkit-scrollbar { display: none; }
    input::placeholder { color: #6E6A78; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#0E0D10; font-family:'Manrope',sans-serif; color:#F3F1ED; position:relative; overflow:hidden; display:flex; flex-direction:column;">

  <div style="flex:0 0 auto; padding:20px 24px 0; display:flex; align-items:center; justify-content:space-between;">
    <div style="width:38px; height:38px; border-radius:50%; background:#17161A; border:1px solid #201E24; display:flex; align-items:center; justify-content:center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F3F1ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </div>
    <span style="font-size:11.5px; font-weight:700; color:#8B8794; letter-spacing:0.02em;">Step 6 of 6</span>
  </div>

  <div style="flex:0 0 auto; padding:16px 24px 0; display:flex; gap:5px;">
    <div style="flex:1; height:4px; border-radius:3px; background:{{accentHex}};"></div>
    <div style="flex:1; height:4px; border-radius:3px; background:{{accentHex}};"></div>
    <div style="flex:1; height:4px; border-radius:3px; background:{{accentHex}};"></div>
    <div style="flex:1; height:4px; border-radius:3px; background:{{accentHex}};"></div>
    <div style="flex:1; height:4px; border-radius:3px; background:{{accentHex}};"></div>
    <div style="flex:1; height:4px; border-radius:3px; background:{{accentHex}};"></div>
  </div>

  <div style="flex:0 0 auto; padding:24px 24px 0;">
    <div style="font-family:'Bodoni Moda',serif; font-size:24px; font-weight:600; color:#FFFFFF;">Start your watchlist</div>
    <p style="font-size:13px; color:#8B8794; margin:7px 0 16px;">Add a few movies you&rsquo;ve been meaning to watch <span style="color:#6E6A78;">(optional)</span></p>
    <div style="display:flex; align-items:center; gap:8px; padding:11px 14px; border-radius:11px; background:#17161A; border:1px solid #2A2730; margin-bottom:14px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E6A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <input type="text" placeholder="Search for a movie" style="flex:1; border:none; outline:none; background:transparent; font-family:'Manrope',sans-serif; font-size:13px; color:#F3F1ED;">
    </div>
  </div>

  <div style="flex:1; min-height:0; overflow-y:auto; padding:0 24px;">
    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:12px 10px;">

      <div style="position:relative;">
        <div style="width:100%; aspect-ratio:2/3; border-radius:10px; background:linear-gradient(160deg, #23202A 0%, #14121A 100%); border:1px solid #2A2730;"></div>
        <div style="position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:50%; background:rgba(14,13,16,0.75); border:1.5px solid #4A4652; display:flex; align-items:center; justify-content:center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8B8794" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></div>
        <div style="font-size:10.5px; color:#C9C5D1; margin-top:5px; text-align:center;">Poor Things</div>
      </div>

      <div style="position:relative;">
        <div style="width:100%; aspect-ratio:2/3; border-radius:10px; background:radial-gradient(140% 100% at 30% 10%, rgba({{accentRgb}},0.28), transparent 60%), linear-gradient(160deg, #23202A 0%, #14121A 100%); border:2px solid {{accentHex}};"></div>
        <div style="position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:50%; background:{{accentHex}}; display:flex; align-items:center; justify-content:center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0E0D10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></div>
        <div style="font-size:10.5px; color:#C9C5D1; margin-top:5px; text-align:center;">Dune: Part Two</div>
      </div>

      <div style="position:relative;">
        <div style="width:100%; aspect-ratio:2/3; border-radius:10px; background:linear-gradient(160deg, #201C26 0%, #121016 100%); border:1px solid #2A2730;"></div>
        <div style="position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:50%; background:rgba(14,13,16,0.75); border:1.5px solid #4A4652; display:flex; align-items:center; justify-content:center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8B8794" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></div>
        <div style="font-size:10.5px; color:#C9C5D1; margin-top:5px; text-align:center;">Civil War</div>
      </div>

      <div style="position:relative;">
        <div style="width:100%; aspect-ratio:2/3; border-radius:10px; background:radial-gradient(120% 100% at 30% 20%, rgba({{accentRgb}},0.22), transparent 60%), linear-gradient(160deg, #1E1B24 0%, #121016 100%); border:2px solid {{accentHex}};"></div>
        <div style="position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:50%; background:{{accentHex}}; display:flex; align-items:center; justify-content:center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0E0D10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></div>
        <div style="font-size:10.5px; color:#C9C5D1; margin-top:5px; text-align:center;">Anora</div>
      </div>

      <div style="position:relative;">
        <div style="width:100%; aspect-ratio:2/3; border-radius:10px; background:linear-gradient(160deg, #23202A 0%, #14121A 100%); border:1px solid #2A2730;"></div>
        <div style="position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:50%; background:rgba(14,13,16,0.75); border:1.5px solid #4A4652; display:flex; align-items:center; justify-content:center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8B8794" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></div>
        <div style="font-size:10.5px; color:#C9C5D1; margin-top:5px; text-align:center;">The Substance</div>
      </div>

      <div style="position:relative;">
        <div style="width:100%; aspect-ratio:2/3; border-radius:10px; background:linear-gradient(160deg, #201C26 0%, #121016 100%); border:1px solid #2A2730;"></div>
        <div style="position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:50%; background:rgba(14,13,16,0.75); border:1.5px solid #4A4652; display:flex; align-items:center; justify-content:center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8B8794" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></div>
        <div style="font-size:10.5px; color:#C9C5D1; margin-top:5px; text-align:center;">Challengers</div>
      </div>

    </div>
  </div>

  <div style="flex:0 0 auto; padding:16px 24px 32px;">
    <div style="font-size:11.5px; color:#8B8794; text-align:center; margin-bottom:12px;">2 added to watchlist</div>
    <div style="display:flex; align-items:center; justify-content:center; padding:15px; border-radius:12px; background:{{accentHex}}; box-shadow:0 0 20px rgba({{accentRgb}},0.35);">
      <span style="font-size:14px; font-weight:700; color:#0E0D10;">Create Account</span>
    </div>
    <div style="display:flex; justify-content:center; gap:18px; margin-top:14px;">
      <a href="#" style="font-size:13px; font-weight:600; color:#8B8794;">Back</a>
      <a href="#" style="font-size:13px; font-weight:600; color:#8B8794;">Skip for now</a>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"enum","default":"emerald","options":["emerald","cyan","purple","pink","amber","red"],"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    const themes = {
      emerald: { hex: '#00C896', rgb: '0,200,150' },
      cyan:    { hex: '#00E5FF', rgb: '0,229,255' },
      purple:  { hex: '#A855F7', rgb: '168,85,247' },
      pink:    { hex: '#FF7AC2', rgb: '255,122,194' },
      amber:   { hex: '#FFB020', rgb: '255,176,32' },
      red:     { hex: '#FF385C', rgb: '255,56,92' }
    };
    const t = themes[this.props.accent] || themes.emerald;
    return { accentHex: t.hex, accentRgb: t.rgb };
  }
}
</script>
</body>
</html>
