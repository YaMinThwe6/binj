<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #B7B2BF; }
    a:hover { color: #F3F1ED; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#0E0D10; font-family:'Manrope',sans-serif; color:#F3F1ED; position:relative; overflow:hidden;">

  <!-- dimmed backdrop: same hero + start of actions, behind the sheet -->
  <div style="position:relative; width:100%; height:460px; overflow:hidden;">
    <div style="position:absolute; inset:0; background:
      radial-gradient(120% 90% at 85% 5%, rgba(150,170,200,0.14), transparent 55%),
      radial-gradient(100% 80% at 5% 95%, rgba({{accentRgb}},0.22), transparent 55%),
      linear-gradient(180deg, #1B1720 0%, #100E12 100%);
    "></div>
    <div style="position:absolute; bottom:0; left:0; right:0; height:300px; background:linear-gradient(180deg, transparent, rgba(14,13,16,0.92) 65%, #0E0D10 100%);"></div>
    <div style="position:absolute; left:16px; right:16px; bottom:20px; padding:20px; border-radius:20px; background:rgba(23,21,26,0.55); backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%); border:1px solid rgba(255,255,255,0.12);">
      <div style="font-family:'Bodoni Moda',serif; font-size:30px; line-height:1.05; font-weight:600; color:#FFFFFF;">Dune: Part Two</div>
    </div>
  </div>
  <div style="padding:24px 20px;">
    <div style="display:flex; gap:10px;">
      <div style="flex:1; height:74px; border-radius:14px; background:#1A1820; border:1px solid #2A2730;"></div>
      <div style="flex:1; height:74px; border-radius:14px; background:#1A1820; border:1px solid #2A2730;"></div>
      <div style="flex:1; height:74px; border-radius:14px; background:{{accentHex}}; box-shadow:0 0 24px rgba({{accentRgb}},0.5), 0 4px 12px rgba(0,0,0,0.4);"></div>
    </div>
  </div>

  <!-- scrim over everything behind the sheet -->
  <div style="position:absolute; inset:0; background:rgba(8,7,9,0.66);"></div>

  <!-- bottom sheet -->
  <div style="position:absolute; left:0; right:0; bottom:0; border-radius:24px 24px 0 0; background:#161419; border:1px solid #2A2730; border-bottom:none; box-shadow:0 -18px 40px rgba(0,0,0,0.5); padding:12px 20px 28px; display:flex; flex-direction:column; gap:20px;">

    <div style="width:40px; height:4px; border-radius:999px; background:#3A3742; margin:4px auto 0;"></div>

    <div style="display:flex; align-items:flex-start; justify-content:space-between;">
      <div>
        <div style="font-size:18px; font-weight:700; color:#F3F1ED; margin-bottom:4px;">Rate &amp; Review</div>
        <div style="font-size:12.5px; color:#8B8794;">Dune: Part Two</div>
      </div>
      <div style="width:32px; height:32px; border-radius:50%; background:#1F1C24; display:flex; align-items:center; justify-content:center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B7B2BF" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </div>
    </div>

    <div style="display:flex; gap:10px; justify-content:center;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="{{accentHex}}" style="filter:drop-shadow(0 0 7px rgba({{accentRgb}},0.7));"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.6 6.1 20.6l1.3-6.6-4.9-4.6 6.6-.8z"></path></svg>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="{{accentHex}}" style="filter:drop-shadow(0 0 7px rgba({{accentRgb}},0.7));"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.6 6.1 20.6l1.3-6.6-4.9-4.6 6.6-.8z"></path></svg>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="{{accentHex}}" style="filter:drop-shadow(0 0 7px rgba({{accentRgb}},0.7));"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.6 6.1 20.6l1.3-6.6-4.9-4.6 6.6-.8z"></path></svg>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="{{accentHex}}" style="filter:drop-shadow(0 0 7px rgba({{accentRgb}},0.7));"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.6 6.1 20.6l1.3-6.6-4.9-4.6 6.6-.8z"></path></svg>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3A3742" stroke-width="1.5"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.6 6.1 20.6l1.3-6.6-4.9-4.6 6.6-.8z"></path></svg>
    </div>

    <div style="border-radius:14px; background:#1A1820; border:1px solid #2A2730; padding:14px; min-height:76px;">
      <span style="font-size:13.5px; color:#6E6A78;">Share your thoughts (optional)&hellip;</span>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between;">
      <span style="font-size:13.5px; font-weight:600; color:#F3F1ED;">Post anonymously</span>
      <div style="width:42px; height:24px; border-radius:999px; background:{{accentHex}}; position:relative;">
        <div style="width:18px; height:18px; border-radius:50%; background:#0E0D10; position:absolute; top:3px; right:3px;"></div>
      </div>
    </div>

    <div style="width:100%; padding:15px; border-radius:14px; background:{{accentHex}}; box-shadow:0 0 24px rgba({{accentRgb}},0.5), 0 4px 12px rgba(0,0,0,0.4); text-align:center; font-size:14.5px; font-weight:700; color:#0E0D10;">Post Review</div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"enum","default":"emerald","options":["emerald","cyan","purple","pink","amber","red"],"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    const themes = {
      emerald: { hex: '#00C896', rgb: '0,200,150' },
      cyan:    { hex: '#00E5FF', rgb: '0,229,255' },
      purple:  { hex: '#A855F7', rgb: '168,85,247' },
      pink:    { hex: '#FF7AC2', rgb: '255,122,194' },
      amber:   { hex: '#FFB020', rgb: '255,176,32' },
      red:     { hex: '#FF385C', rgb: '255,56,92' }
    };
    const t = themes[this.props.accent] || themes.emerald;
    return { accentHex: t.hex, accentRgb: t.rgb };
  }
}
</script>
</body>
</html>
