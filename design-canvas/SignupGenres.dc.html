<!doctype html>
<html>
<head>

  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }

    a { color: #B7B2BF; text-decoration:none; }

<div style="width:390px; height:844px; background:#0E0D10; font-family:'Manrope',sans-serif; color:#F3F1ED; position:relative; overflow:hidden; display:flex; flex-direction:column;">

  <div style="flex:0 0 auto; padding:20px 24px 0; display:flex; align-items:center; justify-content:space-between;">
    <div style="width:38px; height:38px; border-radius:50%; background:#17161A; border:1px solid #201E24; display:flex; align-items:center; justify-content:center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F3F1ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </div>
    <span style="font-size:11.5px; font-weight:700; color:#8B8794; letter-spacing:0.02em;">Step 4 of 6</span>
  </div>

  <div style="flex:0 0 auto; padding:16px 24px 0; display:flex; gap:5px;">
    <div style="flex:1; height:4px; border-radius:3px; background:{{accentHex}};"></div>
    <div style="flex:1; height:4px; border-radius:3px; background:{{accentHex}};"></div>
    <div style="flex:1; height:4px; border-radius:3px; background:{{accentHex}};"></div>
    <div style="flex:1; height:4px; border-radius:3px; background:{{accentHex}};"></div>

    <div style="flex:1; height:4px; border-radius:3px; background:#232028;"></div>
  </div>

  <div style="flex:1; padding:32px 28px 40px; display:flex; flex-direction:column;">
    <div style="font-family:'Bodoni Moda',serif; font-size:26px; font-weight:600; color:#FFFFFF;">What are you into?</div>
    <p style="font-size:13.5px; color:#8B8794; margin:8px 0 26px;">Select your favorite genres <span style="color:#6E6A78;">(optional)</span></p>

    <div style="display:flex; flex-wrap:wrap; gap:9px;">
      <div style="padding:10px 16px; border-radius:20px; background:#17161A; border:1px solid #2A2730;"><span style="font-size:13px; font-weight:600; color:#C9C5D1;">Action</span></div>
      <div style="padding:10px 16px; border-radius:20px; background:#17161A; border:1px solid #2A2730;"><span style="font-size:13px; font-weight:600; color:#C9C5D1;">Adventure</span></div>
      <div style="padding:10px 16px; border-radius:20px; background:#17161A; border:1px solid #2A2730;"><span style="font-size:13px; font-weight:600; color:#C9C5D1;">Animation</span></div>
      <div style="padding:10px 16px; border-radius:20px; background:#17161A; border:1px solid #2A2730;"><span style="font-size:13px; font-weight:600; color:#C9C5D1;">Comedy</span></div>
      <div style="padding:10px 16px; border-radius:20px; background:#17161A; border:1px solid #2A2730;"><span style="font-size:13px; font-weight:600; color:#C9C5D1;">Crime</span></div>
      <div style="padding:10px 16px; border-radius:20px; background:#17161A; border:1px solid #2A2730;"><span style="font-size:13px; font-weight:600; color:#C9C5D1;">Documentary</span></div>
      <div style="padding:10px 16px; border-radius:20px; background:{{accentHex}};"><span style="font-size:13px; font-weight:700; color:#0E0D10;">Drama</span></div>

      <div style="padding:10px 16px; border-radius:20px; background:#17161A; border:1px solid #2A2730;"><span style="font-size:13px; font-weight:600; color:#C9C5D1;">Historical</span></div>
      <div style="padding:10px 16px; border-radius:20px; background:{{accentHex}};"><span style="font-size:13px; font-weight:700; color:#0E0D10;">Horror</span></div>
      <div style="padding:10px 16px; border-radius:20px; background:#17161A; border:1px solid #2A2730;"><span style="font-size:13px; font-weight:600; color:#C9C5D1;">Mystery</span></div>
      <div style="padding:10px 16px; border-radius:20px; background:#17161A; border:1px solid #2A2730;"><span style="font-size:13px; font-weight:600; color:#C9C5D1;">Romance</span></div>
      <div style="padding:10px 16px; border-radius:20px; background:#17161A; border:1px solid #2A2730;"><span style="font-size:13px; font-weight:600; color:#C9C5D1;">Sci-Fi</span></div>

      <span style="font-size:14px; font-weight:700; color:#0E0D10;">Continue</span>
    </div>
    <div style="display:flex; justify-content:center; gap:18px; margin-top:16px;">
      <a href="#" style="font-size:13px; font-weight:600; color:#8B8794;">Back</a>
      <a href="#" style="font-size:13px; font-weight:600; color:#8B8794;">Skip for now</a>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"enum","default":"emerald","options":["emerald","cyan","purple","pink","amber","red"],"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    const themes = {
      emerald: { hex: '#00C896', rgb: '0,200,150' },
      cyan:    { hex: '#00E5FF', rgb: '0,229,255' },
      purple:  { hex: '#A855F7', rgb: '168,85,247' },
      pink:    { hex: '#FF7AC2', rgb: '255,122,194' },
      amber:   { hex: '#FFB020', rgb: '255,176,32' },
      red:     { hex: '#FF385C', rgb: '255,56,92' }
    };
    const t = themes[this.props.accent] || themes.emerald;
    return { accentHex: t.hex, accentRgb: t.rgb };
  }
}
</script>
</body>
</html>
